<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>永駿業務系統</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#E6EAEF; --fg:#1C2733; --muted:#5B6878; --line:#D3D9E0;
  --ink:#1C2733; --accent:#B4611A; --accent-soft:#F6E7D8; --ok:#2E7D4F; --ok-soft:#DFF0E5; --warn:#B3261E; --warn-soft:#F8E1DF;
  --pri:#1F4E79; --heat1:#FBE3E1; --heat2:#F4B8B3; --heat3:#D9534F; --hl:#FFF4C2; --line-green:#06C755;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141A21; --surface:#1C242D; --surface2:#252F3A; --fg:#E7ECF1; --muted:#9AA7B5; --line:#2C3642;
  --ink:#C9D6E6; --accent:#E08A3C; --accent-soft:#3A2A18; --ok:#5CB880; --ok-soft:#173025; --warn:#F07167; --warn-soft:#3A1E1C;
  --pri:#3D7AB8; --heat1:#3A1F21; --heat2:#5C2427; --heat3:#A8302C; --hl:#3A3414; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.55;
  padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 90px max(14px,env(safe-area-inset-left))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.top h1{font-size:19px} .top .who{font-size:13px;color:var(--muted)}
.pages{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.pages button{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:15px}
.pages button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--pri)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.sec{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.label{font-size:12px;letter-spacing:.05em;color:var(--muted);font-weight:700}
.notice{border-radius:8px;padding:8px 12px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.notice.secret{background:var(--warn-soft);color:var(--warn);font-weight:700}
.notice.rule{background:var(--surface2);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.chip:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.active{background:var(--accent-soft);color:var(--accent)} .pill.ready{background:var(--ok-soft);color:var(--ok)}
.pill.stale{background:var(--warn-soft);color:var(--warn)} .pill.done{background:var(--surface2);color:var(--muted)}
.need{color:var(--accent);font-weight:700;font-size:12px}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:70px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .n{font-family:var(--f-mono);font-size:26px;font-weight:700;line-height:1.2}
.kpi.ok .n{color:var(--ok)}
/* stock */
.stock table{min-width:1250px;font-size:13.5px}
.stock td,.stock th{white-space:nowrap;padding:7px 6px}
.stock td.num{text-align:right;font-family:var(--f-mono)}
.stock tr.h1 td{background:var(--heat1)} .stock tr.h2 td{background:var(--heat2)} .stock tr.h3 td{background:var(--heat3);color:#fff}
.stock tr.h3 .pill{background:rgba(255,255,255,.25);color:#fff} .stock tr.h3 .btn:not(.acc){color:var(--fg)}
.stock tr.sold td{color:var(--muted)}
.stock th.pin,.stock td.pin{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:6px 0 8px -6px rgba(0,0,0,.25)}
.stock tr.h1 td.pin{background:var(--heat1)} .stock tr.h2 td.pin{background:var(--heat2)} .stock tr.h3 td.pin{background:var(--heat3)}
.stock th:last-child,.stock td:last-child{position:sticky;right:0;background:var(--surface);box-shadow:-6px 0 8px -6px rgba(0,0,0,.25)}
.stock tr.h1 td:last-child{background:var(--heat1)} .stock tr.h2 td:last-child{background:var(--heat2)} .stock tr.h3 td:last-child{background:var(--heat3)}
@media (max-width:700px){.stock th:last-child,.stock td:last-child{position:static;box-shadow:none}}
.wm{position:fixed;inset:0;pointer-events:none;z-index:5}
/* count */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].in{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].out{background:var(--accent);color:#fff}
.seg button[aria-pressed="true"].miss{background:var(--warn);color:#fff}
.cnt-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cnt-row:first-child{border-top:0}
.cnt-row .no{font-family:var(--f-mono);color:var(--muted);text-align:right}
.cnt-row .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.cnt-row .extra{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:640px){.cnt-row{grid-template-columns:24px minmax(0,1fr)}.cnt-row .ctl{grid-column:2/-1;justify-content:flex-start}}
.sticky-bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px}
.hist table{min-width:860px;font-size:13px}
.hist td,.hist th{padding:6px;white-space:nowrap;text-align:center}
.hist td.l,.hist th.l{text-align:left}
.hist th.pin,.hist td.pin{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;box-shadow:6px 0 8px -6px rgba(0,0,0,.25)}
.hist .ok{color:var(--ok);font-weight:700} .hist .o{color:var(--accent);font-weight:700} .hist .x{color:var(--warn);font-weight:700}
.hist th.nc{color:var(--warn)}
/* board */
.board table{min-width:720px}
.board th,.board td{text-align:center;border:1px solid var(--line);padding:8px 6px}
.board th.g1{background:var(--ok-soft)} .board th.g2{background:var(--surface2)} .board th.g3{background:var(--accent-soft)}
.board td.name{font-weight:700;text-align:left}
.board td.act{font-family:var(--f-mono);font-size:20px;font-weight:700}
.board td.act.zero{background:var(--hl)} .board td.act.hit{color:var(--ok)}
.board td.tgt,.board td.yr{font-family:var(--f-mono);color:var(--muted)}
.board tr.total td{font-weight:700;background:var(--surface2)}
.lists{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:700px){.lists{grid-template-columns:1fr}}
.lists h4{margin:0 0 4px;font-size:14px} .lists .who-h{font-weight:700;font-size:13px;margin-top:6px} .lists .car{font-family:var(--f-mono);font-size:13px}
.push{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--surface2)}
.push .ic{width:26px;height:26px;border-radius:7px;background:var(--line-green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:10px}
/* forms / modal */
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form2 label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.form2 input,.form2 select{font-weight:400;color:var(--fg);width:100%}
.form2 .full{grid-column:1/-1}
.form2 input[type=checkbox]{width:auto;flex:none}
.modal textarea{width:100%;box-sizing:border-box}
@media (max-width:420px){.form2{grid-template-columns:1fr}}
.calc{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;z-index:25;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;padding:18px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:6px;font-size:13px}
.log div{display:grid;grid-template-columns:56px 1fr;gap:8px}
/* prep (phase 2) */
.grid2{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.olist{display:flex;flex-direction:column;gap:8px}
.kpis6{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}.kpi .s{font-size:12px;color:var(--muted)}
.prep8{display:grid;grid-template-columns:repeat(8,minmax(34px,1fr));gap:4px}
.pi{border-radius:6px;padding:4px 2px;text-align:center;font-size:11px;font-weight:700;line-height:1.25;border:1px solid transparent;cursor:pointer}
.pi.todo{background:var(--warn-soft);color:var(--warn)}.pi.doing{background:var(--accent-soft);color:var(--accent)}
.pi.done{background:var(--ok-soft);color:var(--ok)}.pi.na{background:var(--surface2);color:var(--muted);text-decoration:line-through}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.carrow{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(290px,2.4fr) 110px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.carrow:first-child{border-top:0}@media (max-width:760px){.carrow{grid-template-columns:minmax(0,1fr)}}
.exp{display:grid;grid-template-columns:minmax(150px,1.3fr) 60px 90px 1fr 1fr 110px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.exp:first-child{border-top:0}@media (max-width:760px){.exp{grid-template-columns:1fr 1fr}.exp>:first-child{grid-column:1/-1}}
.log2 .it{padding:8px 0;border-top:1px solid var(--line)}.log2 .it:first-child{border-top:0}.day{font-weight:700;font-size:13px;color:var(--muted);margin-top:8px}
.grid2b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}@media (max-width:860px){.grid2b{grid-template-columns:minmax(0,1fr)}}
.prepgrid{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr);gap:14px;align-items:start}@media (max-width:860px){.prepgrid{grid-template-columns:minmax(0,1fr)}.prepgrid aside{order:-1}}
.qrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}.qrow:first-child{border-top:0}
.qn{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.itemrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.itemrow .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;background:var(--surface);padding:5px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.done100{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 12px;font-weight:700;text-align:center}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fact{background:var(--surface2);border-radius:8px;padding:10px 12px;min-width:0}.fact .label{font-size:12px}
.fact .v{font-family:var(--f-mono);font-size:17px;font-weight:600;line-height:1.35}
.fact.key{background:var(--ink);color:var(--bg)}.fact.key .label{color:inherit;opacity:.75}
@media (max-width:700px){.facts{grid-template-columns:1fr 1fr}}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.tl2{display:flex;flex-direction:column}.tl2 .it{padding:10px 0;border-top:1px solid var(--line)}.tl2 .it:first-child{border-top:0}
.svgrid .back{display:none}
@media (max-width:820px){.svgrid.picked .olist,.svgrid.picked .olist-h{display:none}.svgrid:not(.picked) .cdetail{display:none}.svgrid .back{display:inline-flex}}
.ocard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;width:100%}
.ocard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bar{display:flex;gap:3px}.bar i{flex:1;height:7px;border-radius:2px;background:var(--line)}.bar i.d{background:var(--ok)}.bar i.a{background:var(--accent)}
.stg{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.stg:last-child{border-bottom:0}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--line);color:var(--muted)}
.stg.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}.stg.active .dot{border-color:var(--accent);color:var(--accent)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs img{width:84px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--surface2)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:13px;display:block;cursor:pointer}
.drop input{display:none}
.tl{display:flex;flex-direction:column;gap:12px}
.tl .it{border-left:3px solid var(--ok);padding-left:10px}
.bind{border-radius:8px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.bind.no{background:var(--accent-soft)}.bind.yes{background:var(--ok-soft)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:40;padding:12px}.lightbox img{max-width:100%;max-height:88vh;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>永駿車業 業務系統</h1><div class="who" id="who">連線中…</div></div>
    <button class="btn" id="reload" data-reload>重新整理</button>
  </header>
  <nav class="pages" role="tablist" id="nav" hidden>
    <button role="tab" data-page="stock">車源表</button>
    <button role="tab" data-page="prepm">車源管理</button>
    <button role="tab" data-page="count">每日點車</button>
    <button role="tab" data-page="board">分點表</button>
    <button role="tab" data-page="visits">來客紀錄</button>
    <button role="tab" data-page="prep">整備交車</button>
    <button role="tab" data-page="service">客戶服務</button>
    <button role="tab" data-page="dash" id="nav-dash">業務儀表板</button>
    <button role="tab" data-page="bonus" id="nav-bonus" hidden>獎金結算</button>
  </nav>
  <main id="view"><div class="loading">讀取資料中…</div></main>
</div>
<div id="wm" class="wm" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="lb" class="lightbox" hidden><img id="lbimg" alt="照片放大"></div>
<div id="modal" class="modal" hidden><div class="box" id="mbox" role="dialog" aria-modal="true"></div></div>

<script>
// 防呆：這個檔案只能放在 GitHub 的 yongjun-sales，放錯（例如打卡系統 yongjun-punch）會直接顯示警告
if (location.hostname.endsWith('github.io') && !location.pathname.startsWith('/yongjun-sales/')) {
  document.addEventListener('DOMContentLoaded', () => { document.body.innerHTML = '<div style="padding:40px 20px;font:16px/1.7 sans-serif;text-align:center;color:#B3261E"><b style="font-size:20px">⚠️ 檔案放錯地方了</b><br>這是「永駿業務系統」的檔案，應該上傳到 GitHub 的 <b>yongjun-sales</b>。<br>請到這個資料夾的 History 把剛才的上傳還原。</div>'; });
  throw new Error('wrong repo');
}
</script>
<script>
// ===== 設定 =====
const LIFF_ID = '2012275132-8PYWlQ0K';
const API_URL = 'https://script.google.com/macros/s/AKfycbzsewthHYW4Dpz-D-pr4xrmqwK5wKo22B1lEUzReJsa9mzLlutbI5k4sYspnoygb6OIxg/exec';
const START = '2026/11/01';   // 系統上線日：之前的年度數字放在試算表「年度基準」
const BONUS = { saleRate: .3, buyRate: .2, buyBaseLow: 1000, buyBaseHigh: 3000, buyThreshold: 500000 };

// ===== 基本工具 =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = n => (n === '' || n == null || isNaN(n)) ? '' : Number(n).toLocaleString('en-US');
const N = v => (v === '' || v == null) ? null : Number(v);
const pd = s => { const [y, m, d] = s.split('/').map(Number); return new Date(y, m - 1, d); };
const fmtD = d => `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
const addD = (s, n) => fmtD(new Date(pd(s).getTime() + n * 864e5));
const diffD = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const md = s => s ? `${+s.slice(5, 7)}/${+s.slice(8, 10)}` : '—';
const ym = s => s.slice(0, 7);
const isoIn = s => s.replace(/\//g, '-');          // yyyy/MM/dd → input[type=date]
const isoOut = s => (s || '').replace(/-/g, '/');
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 3200); }
function openModal(html) { $('#mbox').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; pendingTrade = null; }

// 電腦版瀏覽器會留著舊的登入憑證（約 1 小時過期），過期就先登出再重新登入
function relogin() { try { liff.logout(); } catch (e) {} liff.login({ redirectUri: location.href }); }
function tokenOk() { try { const t = liff.getDecodedIDToken(); return !!(t && t.exp * 1000 > Date.now() + 60000); } catch (e) { return false; } }
async function api(payload) {
  if (!tokenOk()) { relogin(); throw new Error('relogin'); }
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ idToken: liff.getIDToken() }, payload)) });
  const j = await res.json();
  if (j.authError) { toast('登入已過期，重新登入中…'); setTimeout(relogin, 1200); }
  return j;
}
async function act(payload, busyBtn) {
  if (busyBtn) { busyBtn.disabled = true; busyBtn.dataset.t = busyBtn.textContent; busyBtn.textContent = '處理中…'; }
  try {
    const r = await api(payload);
    toast(r.message || (r.ok ? '完成' : '失敗'));
    if (r.ok) { closeModal(); await load(); }
    return r;
  } catch (e) { toast('連線失敗，請再試一次'); }
  finally { if (busyBtn && document.body.contains(busyBtn)) { busyBtn.disabled = false; busyBtn.textContent = busyBtn.dataset.t; } }
}

function normalize() {
  CARS = D.cars.map(c => ({ id: c['編號'], inDate: c['進貨日'], plate: c['車牌'], brand: c['廠牌'], model: c['車型'], year: c['年份'],
    color: c['顏色'], km: c['里程'], cert: c['認證'], fc: c['廠證'], keys: c['鑰匙'], ask: N(c['開價']), floor: N(c['底價']),
    bonus: N(c['保底獎金']), buyer: c['採購'], manager: c['管理人'], cost: N(c['採購金額']), official: c['類別'] === '公務車', note: c['備註'] }));
  ORDERS = D.orders.map(o => ({ id: o['編號'], carId: o['車輛編號'], plate: o['車牌'], label: o['車款'], seller: o['收訂業務'], date: o['收訂日'],
    cust: o['客戶'], price: N(o['成交價']), eta: o['預計交車日'], status: o['狀態'], delivered: o['交車日'],
    fSale: o['銷售獎金核定'], fBuy: o['採購獎金核定'], stage: +o['整備階段'] || 0, token: o['客戶頁代碼'], code: o['綁定碼'], bound: !!o.bound }));
  PROGRESS = (D.progress || []).map(p => ({ orderId: p['訂單編號'], stage: +p['階段'], note: p['說明'], photos: p.photoUrls || [], by: p['回報人'], time: p['時間'], push: p['推播'] }));
  VISITS = D.visits.map(v => ({ id: v['編號'], date: v['日期'], cust: v['客戶'], type: v['來源'], sales: v['接待業務'], purposes: (v['來意'] || '').split('＋').filter(Boolean),
    carIds: (v['看車編號'] || '').split(',').filter(Boolean), trade: v['估車車款'] ? { car: v['估車車款'], year: v['估車年份'], km: v['估車里程'], ask: N(v['期望價']) } : null,
    tradeStatus: v['估車狀態'], note: v['備註'] }));
  PREPS = {};
  (D.prep || []).forEach(p => { const j = PREP_ITEMS.indexOf(p['項目']); if (j < 0) return; const a = PREPS[p['車輛編號']] = PREPS[p['車輛編號']] || blankPrep();
    a[j] = { st: p['狀態'] || '待處理', who: p['負責人'], date: p['排定日'], note: p['備註'], photos: p.photoUrls || [], by: p['更新人'], time: p['更新時間'] }; });
  CHECKS = {};
  D.checks.forEach(c => { (CHECKS[c['日期']] = CHECKS[c['日期']] || { by: c['點車人'], time: c['時間'], items: {} }).items[c['車輛編號']] = { s: c['狀態'], reason: c['原因'], note: c['備註'] }; });
  if (!boardMonth) boardMonth = ym(D.today);
  if (!bonusMonth) bonusMonth = ym(D.today);
  draft = null;
}
const orderOf = c => ORDERS.find(o => o.carId === c.id && o.status !== '已退訂');
const status = c => c.official ? '公務車' : (orderOf(c)?.status || '在庫');
const inLot = c => ['在庫', '已收訂', '公務車'].includes(status(c));
const carById = id => CARS.find(c => c.id === id);
const label = c => `${String(c.year).slice(0, 4)} ${c.model}`;
const belong = c => c.official ? '公務車' : c.buyer === '寄賣' ? '寄賣' : '文中';
function stockDays(c) { const o = orderOf(c); const end = o && o.delivered ? o.delivered : D.today; return diffD(c.inDate, end); }
const visitsOf = c => VISITS.filter(v => v.carIds.includes(c.id));
function lastCheck(c) { for (const d of Object.keys(CHECKS).sort().reverse()) { const it = CHECKS[d].items[c.id]; if (it) return { d, ...it }; } return null; }

async function load() {
  const r = await api({ action: 'all' });
  if (!r.ok) { $('#view').innerHTML = `<div class="panel">${esc(r.message)}</div>`; $('#who').textContent = ''; return; }
  D = r; normalize();
  const nm = D.me.isBoss && D.me.en !== D.me.name ? D.me.en : D.me.name + (D.me.en !== D.me.name ? '（' + D.me.en + '）' : NICK[D.me.name] ? '（' + NICK[D.me.name] + '）' : '');
  $('#who').textContent = `${nm}・${D.me.isBoss ? '主管' : D.me.isOffice ? '行政' : '業務'}・${D.today}`;
  $('#nav').hidden = false; $('#nav-bonus').hidden = !isBoss(); $('#nav-dash').hidden = !D.dash;
  render();
}

function calcBonus(c, price, sellerIsCompany) {
  const diff = price - c.floor;
  const buyer = SALES().includes(c.buyer) ? c.buyer : null;
  const sale = sellerIsCompany ? 0 : diff < 0 ? null : Math.round(c.bonus + diff * BONUS.saleRate);
  const buy = !buyer || diff < 0 ? 0 : Math.round(((c.cost || 0) >= BONUS.buyThreshold ? BONUS.buyBaseHigh : BONUS.buyBaseLow) + diff * BONUS.buyRate);
  return { diff, sale, buy, buyer, below: diff < 0 };
}

function updCalc(c) {
  const el = $('#o-calc'); if (!el) return;
  const comp = $('#o-sales') && $('#o-sales').value === '';

  el.innerHTML = '只有主管看得到：' + (r.below ? `成交價低於底價 <b class="mono">${money(-r.diff)}</b>，銷售獎金待斟酌${r.buyer ? `；${r.buyer} 沒有採購獎金` : ''}`
    : `${comp ? '公司車沒有銷售獎金' : `銷售獎金 <b class="mono">${money(r.sale)}</b>`}${r.buyer ? `；採購獎金（${r.buyer}）<b class="mono">${money(r.buy)}</b>` : ''}`);

// ===== 整備交車（第二階段）=====
const STG = () => D.stages || ['收訂成交', '貸款／尾款', '過戶／領牌', '保養／維修', '可交車'];
function canReport(o) { const c = carById(o.carId); return canAll() || o.seller === D.me.en || (c && c.manager === D.me.en); }
function myPrep() {
  return ORDERS.filter(o => o.status === '已收訂' && (canAll() || o.seller === D.me.en || carById(o.carId)?.manager === D.me.en))
    .sort((a, b) => (b.stage === STG().length - 1) - (a.stage === STG().length - 1) || a.date.localeCompare(b.date));
}
const pbar = o => `<div class="bar">${STG().map((s, i) => `<i class="${i <= o.stage ? 'd' : i === o.stage + 1 ? 'a' : ''}"></i>`).join('')}</div>`;
const stagePill = o => o.stage >= STG().length - 1 ? '<span class="pill ready">可交車</span>' : `<span class="pill active">${STG()[o.stage]}完成</span>`;
function lastUpdate(o) { const l = PROGRESS.filter(p => p.orderId === o.id).map(p => p.time).sort().pop(); return l || ''; }
function renderPrep() {
  const list = myPrep();
  if (!list.find(o => o.id === selOrder)) selOrder = list[0]?.id || null;
  const o = ORDERS.find(x => x.id === selOrder);
  return `
  <section class="row" style="justify-content:space-between"><div><h2 style="font-size:18px">整備交車</h2>
    <div class="small muted">${canAll() ? '所有整備中的訂單' : '你收訂的車和你管理的車'}・回報會從收訂業務的官方帳號通知客人</div></div></section>
  ${!list.length ? '<div class="panel">目前沒有整備中的訂單。在「車源表」按「收訂」後就會出現在這裡。</div>' : `
  <div class="grid2">
    <aside class="olist">${list.map(m => { const c = carById(m.carId); const stale = lastUpdate(m) && diffD(lastUpdate(m).slice(0, 10), D.today) > 3;
      return `<button class="ocard" data-sel="${m.id}" aria-current="${m.id === selOrder}">
        <span class="row" style="justify-content:space-between;width:100%"><b>${esc(m.cust)}</b><span class="mono small muted">${esc(m.plate)}</span></span>
        <span class="small muted">${esc(label(c))}・收訂 ${esc(m.seller)}${c.manager && c.manager !== m.seller ? '・管理 ' + esc(c.manager) : ''}</span>
        ${pbar(m)}<span class="row" style="gap:6px">${stagePill(m)}${m.bound ? '<span class="pill done">LINE 已綁定</span>' : SALES().includes(m.seller) ? '<span class="pill stale">未綁定</span>' : ''}${stale ? '<span class="pill stale">超過3天未回報</span>' : ''}</span></button>`; }).join('')}</aside>
    ${o ? prepDetail(o) : ''}

const normH = h => String(h || '').replace(/[（(][^)）]*[)）]/g, '').replace(/[\s*＊:：]/g, '').replace(/身份/g, '身分');
function impDate(v, bday) {
  if (v == null || v === '') return '';
  const p2 = n => String(n).padStart(2, '0');
  if (typeof v === 'number') {
    if (v >= 19000101 && v <= 21001231) { const t = String(Math.round(v)); return `${t.slice(0, 4)}/${t.slice(4, 6)}/${t.slice(6, 8)}`; }
    if (v >= 1000000 && v <= 1991231) { const t = String(Math.round(v)).padStart(7, '0'); return `${+t.slice(0, 3) + 1911}/${t.slice(3, 5)}/${t.slice(5, 7)}`; }
    const o = XLSX.SSF.parse_date_code(v); return o ? `${o.y}/${p2(o.m)}/${p2(o.d)}` : null;
  }
  let t = String(v).trim().replace(/^民國/, '').replace(/[年月]/g, '/').replace(/[日號]/g, '').replace(/[.\-\s]+/g, '/').replace(/\/+$/, '');
  if (/^\d{7,8}$/.test(t)) t = t.length === 8 ? `${t.slice(0, 4)}/${t.slice(4, 6)}/${t.slice(6)}` : `${t.slice(0, 3)}/${t.slice(3, 5)}/${t.slice(5)}`;
  const a = t.split('/').map(Number);
  if (a.length === 2 && bday && a.every(Boolean)) return `1900/${p2(a[0])}/${p2(a[1])}`;
  if (a.length !== 3 || a.some(x => !x)) return null;
  let [y, m, d] = a; if (y < 1000) y += 1911;
  if (m > 12 || d > 31) return null;
  return `${y}/${p2(m)}/${p2(d)}`;
}
async function readImport(file) {
  await loadXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  const names = IMP_COLS.find(c => c[0] === 'name'), isName = h => [names[1], ...names[2]].includes(normH(h));
  const hi = aoa.slice(0, 10).findIndex(r => r.some(isName));
  if (hi < 0) throw new Error('找不到標題列，第一列要有「客戶姓名」等欄位名稱（可以先下載範本）');
  const map = {}; aoa[hi].forEach((h, j) => { const n = normH(h); const c = IMP_COLS.find(c => c[1] === n || c[2].includes(n)); if (c && !(c[0] in map)) map[c[0]] = j; });
  const rows = [], errs = [];
  aoa.slice(hi + 1).forEach((r, i) => {
    if (!r.some(x => String(x).trim())) return;
    const o = { r: hi + i + 2 }, bad = [];
    IMP_COLS.forEach(([k]) => { if (k in map) o[k] = r[map[k]]; });
    ['birthday', 'delivered', 'insExpire', 'inspect'].forEach(k => { if (k in o) { const v = impDate(o[k], k === 'birthday'); if (v === null) { bad.push(IMP_COLS.find(c => c[0] === k)[1] + '看不懂「' + o[k] + '」'); o[k] = ''; } else o[k] = v; } });
    ['seller', 'name', 'idNo', 'phone', 'address', 'car', 'year', 'plate', 'price', 'hasIns', 'insCompany', 'insType', 'insWithUs', 'note'].forEach(k => { o[k] = String(o[k] ?? '').trim(); });
    o.phone = o.phone.replace(/[^\d#+\-]/g, ''); if (/^9\d{8}$/.test(o.phone)) o.phone = '0' + o.phone;
    if (!o.name) bad.push('缺客戶姓名'); if (!o.car) bad.push('缺車型'); if (!o.delivered && !bad.some(b => b.startsWith('購車日期'))) bad.push('缺購車日期');
    if (bad.length) errs.push({ r: o.r, name: o.name, reason: bad.join('、') }); else rows.push(o);
  });
  return { rows, errs, missing: IMP_COLS.filter(c => !(c[0] in map)).map(c => c[1]) };
}

function compress(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onerror = rej; r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
    const k = Math.min(1, 1280 / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', 0.8)); }; img.src = r.result; }; r.readAsDataURL(file); });
}

function startDraft() {

    if (t) { draft[c.id] = { s: t.s, reason: t.reason, note: t.note }; return; }
    let prev = null; for (const d of Object.keys(CHECKS).sort().reverse()) { if (d < today && CHECKS[d].items[c.id]) { prev = CHECKS[d].items[c.id]; break; } }
    draft[c.id] = prev && prev.s === '外出' ? { s: '外出', reason: prev.reason, note: prev.note } : { s: '在店', reason: '', note: '' };
  });
}

// ===== 分點表 =====
function boardData(month) {
  const year = month.slice(0, 4), z = () => ({ buy: 0, order: 0, deliver: 0 }), M = {}, Y = {}, L = {};
  ROWS().forEach(r => { M[r] = z(); Y[r] = z(); L[r] = { buy: [], order: [], deliver: [] }; });
  D.base.filter(b => b['年度'] === year).forEach(b => { const r = b['列']; if (Y[r]) { Y[r].buy += +b['收車'] || 0; Y[r].order += +b['訂車'] || 0; Y[r].deliver += +b['交車'] || 0; } });
  const tag = c => `${String(c.year).slice(0, 4)}_${c.model}_${c.color}`;
  CARS.filter(c => !c.official && c.inDate >= START).forEach(c => { const r = rowOf(c.buyer); if (!M[r]) return; if (ym(c.inDate) === month) { M[r].buy++; L[r].buy.push(tag(c)); } if (c.inDate.slice(0, 4) === year) Y[r].buy++; });
  ORDERS.filter(o => o.status !== '已退訂').forEach(o => { const r = rowOf(o.seller), c = carById(o.carId); if (!M[r] || !c) return;
    if (o.date >= START) { if (ym(o.date) === month) { M[r].order++; L[r].order.push(tag(c)); } if (o.date.slice(0, 4) === year) Y[r].order++; }
    if (o.delivered && o.delivered >= START) { if (ym(o.delivered) === month) { M[r].deliver++; L[r].deliver.push(tag(c)); } if (o.delivered.slice(0, 4) === year) Y[r].deliver++; } });
  return { M, Y, L };
}

  const T = {}; D.targets.forEach(t => T[t['列']] = { buy: +t['收車'] || 0, order: +t['訂車'] || 0, deliver: +t['交車'] || 0 });

  const lst = k => ROWS().map(r => `<div class="who-h">${r}</div>${L[r][k].map(c => `<div class="car">${esc(c)}</div>`).join('')}`).join('');
  return `

    <div><h2 style="font-size:18px">頂好汽車｜文中店 分點表</h2><div class="small muted">自動統計，所有員工都看得到</div></div>

    <tbody>${ROWS().map(r => `<tr><td class="name">${r}</td>${cell(r, 'buy')}${cell(r, 'order')}${cell(r, 'deliver')}</tr>`).join('')}
    <tr class="total"><td class="name">TOTAL</td>${['buy', 'order', 'deliver'].map(k => `<td class="tgt">${tsum(k)}</td><td class="act">${sum(M, k)}</td><td class="yr">${sum(Y, k)}</td>`).join('')}</tr></tbody>

// ===== 獎金結算（主管）=====
function bonusOf(o) {
  const c = carById(o.carId); if (!c || c.floor == null || o.price == null) return null;
  const r = calcBonus(c, o.price, !SALES().includes(o.seller));
  return { ...r, c, fSale: o.fSale !== '' ? +o.fSale : r.sale, fBuy: o.fBuy !== '' ? +o.fBuy : r.buy, pending: r.sale == null && o.fSale === '' && SALES().includes(o.seller) };
}
function renderBonus() {
  if (!isBoss()) return '<div class="panel">只有主管看得到</div>';
  const list = ORDERS.filter(o => o.status === '已交車' && ym(o.delivered) === bonusMonth).sort((a, b) => a.delivered.localeCompare(b.delivered));
  const waiting = ORDERS.filter(o => o.status === '已收訂').sort((a, b) => a.date.localeCompare(b.date));
  const sum = {}; SALES().forEach(s => sum[s] = { sale: 0, buy: 0, pending: 0 });
  list.forEach(o => { const b = bonusOf(o); if (!b) return; if (sum[o.seller]) { sum[o.seller].sale += b.fSale || 0; if (b.pending) sum[o.seller].pending++; } if (b.buyer && sum[b.buyer]) sum[b.buyer].buy += b.fBuy || 0; });
  const inp = (o, k, calc) => `<input type="number" data-bf="${o.id}|${k}" value="${(k === 'sale' ? o.fSale : o.fBuy) !== '' ? (k === 'sale' ? o.fSale : o.fBuy) : (calc ?? '')}" placeholder="${calc == null ? '待斟酌' : ''}" style="width:92px;${calc == null && o.fSale === '' && k === 'sale' ? 'border-color:var(--warn)' : ''}" aria-label="核定">`;
  return `
  <div class="notice secret">此頁只有主管看得到。獎金依交車月發放；低於底價的單標紅，等你斟酌金額。</div>

    <div class="row"><label class="label" for="bmon">交車月份</label><select id="bmon">${monthsList(ORDERS.map(o => o.delivered)).map(m => `<option value="${m}" ${m === bonusMonth ? 'selected' : ''}>${m}</option>`).join('')}</select></div></section>
  <section class="kpis">${SALES().map(s => `<div class="kpi"><div class="label">${s}</div><div class="n">${money(sum[s].sale + sum[s].buy)}</div><div class="small muted">銷售 ${money(sum[s].sale)}・採購 ${money(sum[s].buy)}${sum[s].pending ? `・<b style="color:var(--warn)">待斟酌 ${sum[s].pending}</b>` : ''}</div></div>`).join('')}
    <div class="kpi"><div class="label">合計</div><div class="n">${money(Object.values(sum).reduce((a, b) => a + b.sale + b.buy, 0))}</div><div class="small muted">交車 ${list.length} 台</div></div></section>
  <section class="panel" style="padding:0"><div class="tbl-wrap"><table style="min-width:1080px;font-size:13.5px">
    <thead><tr><th>交車日</th><th>車輛</th><th>客人</th><th style="text-align:right">成交價</th><th style="text-align:right">底價</th><th style="text-align:right">差額</th><th>銷售</th><th style="text-align:right">試算</th><th>核定</th><th>採購人</th><th style="text-align:right">試算</th><th>核定</th></tr></thead>
    <tbody>${list.map(o => { const b = bonusOf(o); if (!b) return `<tr><td colspan="12" class="muted">${esc(o.label)}：缺少成交價或底價</td></tr>`; const c = b.c, comp = !SALES().includes(o.seller);
      return `<tr style="${b.below ? 'background:var(--warn-soft)' : ''}"><td class="mono">${md(o.delivered)}<div class="small muted">收訂 ${md(o.date)}</div></td><td><b>${esc(label(c))}</b><div class="mono small muted">${esc(c.plate)}</div></td><td>${esc(o.cust)}</td>
      <td class="mono" style="text-align:right">${money(o.price)}</td><td class="mono" style="text-align:right">${money(c.floor)}</td><td class="mono" style="text-align:right;color:${b.below ? 'var(--warn)' : 'var(--ok)'}">${b.diff >= 0 ? '+' : ''}${money(b.diff)}</td>
      <td>${esc(o.seller)}</td><td class="mono" style="text-align:right">${comp ? '—' : b.sale == null ? '<span class="need">低於底價</span>' : money(b.sale)}</td><td>${comp ? '—' : inp(o, 'sale', b.sale)}</td>
      <td>${esc(c.buyer)}${b.buyer ? `<div class="small muted">採購 ${money(c.cost) || '未填'}</div>` : ''}</td><td class="mono" style="text-align:right">${!b.buyer ? '—' : b.below ? '<span class="need">低於底價・無</span>' : money(b.buy)}</td><td>${b.buyer && !b.below ? inp(o, 'buy', b.buy) : '—'}</td></tr>`; }).join('') || '<tr><td colspan="12" class="muted">這個月沒有交車</td></tr>'}</tbody></table></div></section>

    <tbody>${waiting.map(o => { const b = bonusOf(o); const c = carById(o.carId); if (!b) return `<tr><td colspan="8" class="muted">${esc(o.label)}：缺少成交價或底價</td></tr>`; const comp = !SALES().includes(o.seller);
      return `<tr><td class="mono">${md(o.date)}</td><td><b>${esc(label(c))}</b> <span class="mono small muted">${esc(c.plate)}</span></td><td>${esc(o.seller)}</td><td class="mono" style="text-align:right">${money(o.price)} / ${money(c.floor)}</td>
      <td class="mono" style="text-align:right">${comp ? '—' : b.sale == null ? '<span class="need">低於底價</span>' : money(b.sale)}</td><td>${esc(c.buyer)}</td><td class="mono" style="text-align:right">${!b.buyer ? '—' : b.below ? '<span class="need">無</span>' : money(b.buy)}</td><td class="mono">${o.eta ? md(o.eta) : '—'}</td></tr>`; }).join('') || '<tr><td colspan="8" class="muted">沒有</td></tr>'}</tbody></table></div></section>
  <p class="small muted" style="margin:0">銷售獎金＝保底獎金＋（成交價−底價）×30%，低於底價由主管斟酌；公司車（管理員收訂）沒有銷售獎金。採購獎金只算業務採購的車：採購金額 50 萬以下保底 1,000、以上 3,000，再加（成交價−底價）×20%；低於底價沒有採購獎金。核定欄改過的以核定為準。</p>`;
}

// ===== 畫面 =====
function watermark() {
  const w = $('#wm'); if (page !== 'stock' || !D) { w.hidden = true; return; }
  const txt = `${D.me.name} ${D.today}`;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='240' height='150'><text x='10' y='85' transform='rotate(-20 120 75)' font-size='14' font-family='sans-serif' fill='rgba(128,128,128,0.13)'>${txt}</text></svg>`;
  w.style.backgroundImage = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`; w.hidden = false;
}
function render() {
  if (!D) return;
  if (page === 'bonus' && !isBoss()) page = 'stock';
  if (page === 'dash' && !D.dash) page = 'stock';
  document.querySelectorAll('[data-page]').forEach(b => b.setAttribute('aria-selected', b.dataset.page === page));
  const v = $('#view');
  v.innerHTML = page === 'stock' ? renderStock() : page === 'prepm' ? renderPrepM() : page === 'dash' ? renderDash() : page === 'prep' ? renderPrep() : page === 'service' ? renderService() : page === 'count' ? renderCount() : page === 'visits' ? renderVisits() : page === 'board' ? renderBoard() : renderBonus();
  v.style.cssText = 'display:flex;flex-direction:column;gap:14px';
  watermark();
}

document.addEventListener('click', async e => {

  if (e.target.matches('img[data-zoom]')) { $('#lbimg').src = e.target.src; $('#lb').hidden = false; return; }
  const t = e.target.closest('button,[data-mclose]'); if (!t) return;
  const ds = t.dataset;
  if (ds.reload !== undefined) { $('#view').innerHTML = '<div class="loading">讀取資料中…</div>'; await load(); return; }
  if (!D) return;
  if (ds.mclose !== undefined) { closeModal(); return; }
  if (ds.page) { page = ds.page; render(); window.scrollTo(0, 0); return; }
  if (ds.sf) { stockFilter = ds.sf; render(); return; }

  if (ds.edit) { openModal(carForm(carById(ds.edit))); return; }

  if (ds.pf !== undefined) { prepFilter = ds.pf; page = 'prepm'; render(); return; }

  if (ds.dellog) { if (confirm('刪除這筆工作紀錄？')) await act({ action: 'delLog', id: ds.dellog }, t); return; }
  if (ds.act === 'seekadd') { openModal(`<h3>登記尋車客人</h3><form class="form2" id="skf"><label>客人<input type="text" id="sk1" placeholder="李先生" required></label><label>想找的車<input type="text" id="sk2" placeholder="TOYOTA RAV4" required></label>
    <label>年份<input type="text" id="sk3" placeholder="2019 以後"></label><label>預算<input type="text" id="sk4" placeholder="60 萬內"></label><label class="full">備註<input type="text" id="sk5" placeholder="例如 要白色、電話 0912…"></label>
    <p class="full small muted" style="margin:0">車源表有車型相符的車，會顯示「可能符合」</p><div class="full row" style="justify-content:flex-end"><button type="button" class="btn" data-mclose>取消</button><button class="btn acc" type="submit">登記</button></div></form>`); return; }
  if (ds.act === 'srcadd') { openModal(`<h3>登記找車源</h3><form class="form2" id="srf"><label class="full">車款<input type="text" id="sr1" placeholder="2020 TOYOTA RAV4" required></label><label>來源<input type="text" id="sr2" placeholder="車商、個人、拍賣場"></label><label>開價<input type="text" id="sr3" placeholder="63 萬"></label>
    <label class="full">備註<input type="text" id="sr4" placeholder="例如 里程 5 萬、一手車，下週看車"></label><div class="full row" style="justify-content:flex-end"><button type="button" class="btn" data-mclose>取消</button><button class="btn acc" type="submit">登記</button></div></form>`); return; }
  if (ds.cust) { selCust = ds.cust; svTab = 'list'; notePhotos = []; render(); window.scrollTo(0, 0); return; }
  if (ds.pick !== undefined) { selCust = ds.pick || null; notePhotos = []; render(); window.scrollTo(0, 0); return; }
  if (ds.renew) { await act({ action: 'renewInsurance', id: ds.renew }, t); return; }
  if (ds.card) { const [cid, kind] = ds.card.split('|'); const c = custById(cid); const r = reminders().find(x => x.c['編號'] === cid && x.kind === (kind === 'birthday' ? '生日' : '節日'));
    const hol = Object.keys(SV().holidays).sort().find(d => d >= D.today);
    msgImage = null; openModal(msgModal(c, r || { key: '', kind: kind === 'birthday' ? '生日' : '節日', card: true, title: kind === 'birthday' ? '生日賀卡' : SV().holidays[hol] + '賀卡', detail: '',
      text: kind === 'birthday' ? `${c['客戶']}，生日快樂！感謝您選擇永駿車業，祝福新的一歲平安順心，行車一路順風。` : `${c['客戶']}，${SV().holidays[hol]}快樂！感謝您一路以來的支持，祝您與家人佳節愉快、出入平安。` })); return; }
  if (ds.editcust) { openModal(editCustForm(custById(ds.editcust))); return; }
  if (ds.msg) { msgImage = null; openModal(msgModal(custById(ds.msg))); return; }
  if (ds.rem) { const r = reminders().find(x => x.key === ds.rem); if (r) { msgImage = null; openModal(r.note ? followModal(r) : msgModal(r.c, r)); } return; }
  if (ds.markdone) { await act({ action: 'logContact', id: ds.cid, key: ds.markdone, type: ds.kind, text: ($('#mtext')?.value.trim() || '') ? '其他方式聯絡：' + $('#mtext').value.trim().slice(0, 80) : '已用其他方式聯絡' }, t); return; }
  if (ds.usecp) { const q = SV().coupons.find(x => x['編號'] === ds.usecp); const r = await act({ action: 'useCoupon', id: ds.usecp }, t); return; }
  if (ds.prepgo) { page = 'prep'; selOrder = ds.prepgo; pendingPhotos = []; render(); window.scrollTo(0, 0); return; }
  if (ds.sel) { selOrder = ds.sel; pendingPhotos = []; render(); return; }
  if (ds.copy) { const el = $('#' + ds.copy); el.select(); el.setSelectionRange(0, 99999); let ok = false; try { await navigator.clipboard.writeText(el.value); ok = true; } catch (x) { try { ok = document.execCommand('copy'); } catch (y) {} } toast(ok ? '已複製' : '請長按文字框手動複製'); return; }
  if (ds.cancel) { const o = ORDERS.find(x => x.id === ds.cancel); openModal(`<h3>確定退訂？</h3><p style="margin:0">${esc(o.label)}（${esc(o.plate)}）・客戶 ${esc(o.cust)}</p><p class="small muted" style="margin:0">退訂後車輛回到可收訂，分點表 ${rowOf(o.seller)} 的訂車數扣回。</p><div class="row" style="justify-content:flex-end"><button class="btn" data-mclose>取消</button><button class="btn danger" data-cancelok="${o.id}">確定退訂</button></div>`); return; }
  if (ds.cancelok) { await act({ action: 'cancelOrder', id: ds.cancelok }, t); return; }
  if (ds.visit !== undefined) { openModal(visitForm(ds.visit)); return; }
  if (ds.vlist) { openModal(carVisits(carById(ds.vlist))); return; }
  if (ds.tradebuy) { const x = VISITS.find(v => v.id === ds.tradebuy); pendingTrade = x.id; const [b, ...m] = x.trade.car.split(' ');
    openModal(carForm(null, { trade: { brand: b || '', model: m.join(' '), year: x.trade.year, km: x.trade.km, cost: x.trade.ask } })); pendingTrade = x.id; return; }
  if (ds.tradelost) { await act({ action: 'setTrade', id: ds.tradelost, status: '未成交' }, t); return; }
  if (ds.cs) { const [id, st] = ds.cs.split('|'); draft[id].s = st; if (st === '外出' && !draft[id].reason) draft[id].reason = D.outReasons[0]; render(); return; }
  if (ds.allin !== undefined) { Object.values(draft).forEach(d => d.s = '在店'); render(); return; }
  if (ds.hd) { histDays = +ds.hd; render(); return; }
  if (ds.csubmit !== undefined) { await act({ action: 'submitCheck', items: Object.entries(draft).map(([id, d]) => ({ id, s: d.s, reason: d.reason, note: d.note })) }, t); return; }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'sq' || id === 'vq' || id === 'svq') { if (id === 'sq') stockQ = e.target.value; else if (id === 'vq') visQ = e.target.value; else svQ = e.target.value; const pos = e.target.selectionStart; render(); const s = $('#' + id); s.focus(); s.setSelectionRange(pos, pos); }
});
document.addEventListener('change', async e => {
  const t = e.target, id = t.id;
  if (id === 'bm' || id === 'vm') { boardMonth = t.value; render(); }
  if (id === 'bmon') { bonusMonth = t.value; render(); }
  if (id === 'svs') { svSeller = t.value; render(); }
  if (id === 'dws') { dashWho = t.value; render(); }
  if (id === 'dwm') { dashMonth = t.value; render(); }
  if (t.name === 'lt') { logType = t.value; render(); }
  if (t.dataset.pwho) { const [cid, j] = t.dataset.pwho.split('|'); await prepSave(cid, +j, { who: t.value.trim() }); }
  if (t.dataset.pdate) { const [cid, j] = t.dataset.pdate.split('|'); await prepSave(cid, +j, { date: isoOut(t.value) }); }
  if (t.dataset.pnote) { const [cid, j] = t.dataset.pnote.split('|'); await prepSave(cid, +j, { note: t.value.trim() }); }
  if (t.dataset.pph && t.files.length) { const [cid, j] = t.dataset.pph.split('|'); toast('照片處理中…'); const ph = []; for (const f of [...t.files].slice(0, 4)) { try { ph.push(await compress(f)); } catch (x) {} } if (ph.length) await prepSave(cid, +j, { photos: ph }); }
  if (t.dataset.seekst) await act({ action: 'saveSeek', id: t.dataset.seekst, status: t.value });
  if (t.dataset.srcst) await act({ action: 'saveSource', id: t.dataset.srcst, status: t.value });
  if (id === 'mimg' && t.files[0]) { try { msgImage = await compress(t.files[0]); $('#mthumb').innerHTML = `<img src="${msgImage}" alt="附圖">`; } catch (x) { toast('圖片讀取失敗'); } }
  if (id === 'nphoto') { const files = [...t.files].slice(0, 4 - notePhotos.length); for (const f of files) { try { notePhotos.push(await compress(f)); } catch (x) {} }
    $('#nthumbs').innerHTML = notePhotos.map(p => `<img src="${p}" alt="待上傳照片">`).join(''); }
  if (id === 'pphoto') { const files = [...t.files].slice(0, 8 - pendingPhotos.length); toast('照片處理中…');
    for (const f of files) { try { pendingPhotos.push(await compress(f)); } catch (x) {} }
    $('#pthumbs').innerHTML = pendingPhotos.map(p => `<img src="${p}" alt="待上傳照片">`).join(''); toast(`已選 ${pendingPhotos.length} 張照片`); }
  if (id === 'c-p-see') $('#c-see-box').hidden = !t.checked;
  if (id === 'c-p-trade') $('#c-trade-box').hidden = !t.checked;
  if (t.dataset.cr) draft[t.dataset.cr].reason = t.value;
  if (t.dataset.cn) draft[t.dataset.cn].note = t.value;
  if (t.dataset.bf) { const [oid, k] = t.dataset.bf.split('|'); await act({ action: 'setBonus', id: oid, kind: k, value: t.value }); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button[type=submit]'), g = id => ($('#' + id) ? $('#' + id).value.trim() : '');
  if (f.id === 'cf') {
    const editId = f.dataset.id;
    if (editId) {
      const fields = { '進貨日': isoOut(g('f-in')), '車牌': g('f-plate').toUpperCase(), '廠牌': g('f-brand').toUpperCase(), '車型': g('f-model'), '年份': g('f-year'), '顏色': g('f-color'),
        '里程': g('f-km'), '認證': g('f-cert'), '廠證': g('f-fc'), '鑰匙': g('f-keys'), '採購': g('f-buyer'), '採購金額': g('f-cost'), '備註': g('f-note'),
        '開價': g('f-ask'), '底價': g('f-floor'), '保底獎金': g('f-bonus'), '管理人': g('f-mgr'), '類別': $('#f-official')?.checked ? '公務車' : '一般' };
      await act({ action: 'updateCar', id: editId, fields }, btn);
    } else {
      const car = { inDate: isoOut(g('f-in')), plate: g('f-plate'), brand: g('f-brand'), model: g('f-model'), year: g('f-year'), color: g('f-color'), km: g('f-km'),
        cert: g('f-cert'), fc: g('f-fc'), keys: g('f-keys'), buyer: g('f-buyer'), cost: g('f-cost'), note: g('f-note'), official: !!$('#f-official')?.checked };
      await act({ action: 'addCar', car, visitId: pendingTrade || '' }, btn);
    }
  }
  if (f.id === 'lf') { const r = await act({ action: 'addLog', type: logType, date: isoOut(g('ld')), carId: g('lc'), link: g('ll'), text: g('ltx') }, btn); }
  if (f.id === 'skf') await act({ action: 'saveSeek', cust: g('sk1'), want: g('sk2'), year: g('sk3'), budget: g('sk4'), note: g('sk5') }, btn);
  if (f.id === 'srf') await act({ action: 'saveSource', car: g('sr1'), from: g('sr2'), price: g('sr3'), note: g('sr4') }, btn);
  if (f.id === 'of') await act({ action: 'addOrder', carId: f.dataset.id, seller: g('o-sales'), date: isoOut(g('o-date')), customer: g('o-cust'), price: g('o-price'), eta: isoOut(g('o-eta')) }, btn);
  if (f.id === 'pf') { const note = g('pnote'); if (!note && !pendingPhotos.length) { toast('請至少寫一段說明或附一張照片'); return; }
    const r = await act({ action: 'addProgress', id: selOrder, stage: g('pstage'), note, photos: pendingPhotos, push: !!$('#ppush')?.checked }, btn);
    if (r && r.ok) { pendingPhotos = []; render(); } }
  if (f.id === 'dlv') await act({ action: 'deliver', id: f.dataset.id, date: isoOut(g('d-date')), service: { birthday: isoOut(g('d-bd')), insWithUs: $('#d-insus').checked,
    insCompany: g('d-insco'), insType: g('d-instype'), insExpire: isoOut(g('d-insexp')), coupons: readCoupons(f),
    phone: g('d-tel'), idNo: g('d-idn'), address: g('d-addr'), inspect: isoOut(g('d-insp')) } }, btn);
  if (f.id === 'ocf') await act({ action: 'addCustomer', customer: { seller: g('oc-s'), name: g('oc-n'), car: g('oc-car'), plate: g('oc-p'), delivered: isoOut(g('oc-d')),
    birthday: isoOut(g('oc-b')), insWithUs: $('#oc-us').checked, insCompany: g('oc-ic'), insType: g('oc-it'), insExpire: isoOut(g('oc-ie')), note: g('oc-note'),
    phone: g('oc-tel'), idNo: g('oc-idn'), address: g('oc-addr'), year: g('oc-yr'), price: g('oc-pr'), inspect: isoOut(g('oc-insp')) } }, btn);
  if (f.id === 'ecf') await act({ action: 'updateCustomer', id: f.dataset.id, fields: { '客戶': g('ec-n'), '車款': g('ec-car'), '車牌': g('ec-p'), '生日': isoOut(g('ec-b')),
    '本公司投保': $('#ec-us').checked ? '是' : '否', '保險公司': g('ec-ic'), '保險類型': g('ec-it'), '保險到期日': isoOut(g('ec-ie')), '備註': g('ec-note'), ...($('#ec-d') ? { '交車日': isoOut(g('ec-d')) } : {}),
    '電話': g('ec-tel'), '身分證': g('ec-idn'), '地址': g('ec-addr'), '年份': g('ec-yr'), '價格': g('ec-pr'), '下次驗車日': isoOut(g('ec-insp')) } }, btn);
  if (f.id === 'nf' || f.id === 'ff') { const r = await act({ action: 'addNote', id: f.dataset.id, key: f.dataset.key || '', type: f.id === 'ff' ? '追蹤' : (f.querySelector('[name=ntype]:checked') || {}).value,
      text: g(f.id === 'ff' ? 'ftext' : 'ntext'), followUp: isoOut(g(f.id === 'ff' ? 'ffollow' : 'nfollow')), photos: f.id === 'nf' ? notePhotos : [] }, btn); if (r && r.ok) { notePhotos = []; render(); } }
  if (f.id === 'insf') await act({ action: 'updateCustomer', id: f.dataset.id, fields: { '本公司投保': '是', '保險公司': g('ins-co'), '保險類型': g('ins-ty'), '保險到期日': isoOut(g('ins-exp')) } }, btn);
  if (f.id === 'addcp') { const cid = f.dataset.id; const r = await act({ action: 'addCoupon', id: cid, text: g('ncp-t'), expire: isoOut(g('ncp-e')) }, btn); }
  if (f.id === 'mf') await act({ action: 'sendMessage', id: f.dataset.id, key: f.dataset.key, type: f.dataset.type, text: g('mtext'), image: msgImage || '' }, btn);
  if (f.id === 'vf') {
    const visit = { date: isoOut(g('c-date')), sales: g('c-sales'), customer: g('c-cust'), source: g('c-type'), see: $('#c-p-see').checked, trade: $('#c-p-trade').checked,
      carIds: [...document.querySelectorAll('input[name="c-car"]:checked')].map(x => x.value), tradeCar: g('t-car'), tradeYear: g('t-year'), tradeKm: g('t-km'), tradeAsk: g('t-ask'), note: g('c-note') };
    await act({ action: 'addVisit', visit }, btn);
  }
  if (f.id === 'tf' || f.id === 'basef') {
    const rows = ROWS().map(r => { const o = { row: r }; f.querySelectorAll(`input[data-r="${r}"]`).forEach(i => o[i.dataset.k] = i.value); return o; });
    await act(f.id === 'tf' ? { action: 'saveTargets', targets: rows } : { action: 'saveBase', year: boardMonth.slice(0, 4), base: rows }, btn);
  }
});

// ===== 啟動 =====
(async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    if (!tokenOk()) { relogin(); return; }
    await load();
  } catch (e) {
    $('#view').innerHTML = `<div class="panel">無法連線：${esc(e.message || e)}<br>請關閉頁面，從「頂好汽車｜文中店打卡」選單重新開啟。</div>`;
  }
})();
</script>
</body>
</html>
