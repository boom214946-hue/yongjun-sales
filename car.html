<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>永駿車業｜愛車整備進度</title>
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#1C2733;--muted:#5B6878;--line:#D3D9E0;--navy:#1F3055;--ok:#2E7D4F;--accent:#B4611A;--accent-soft:#F6E7D8}
@media (prefers-color-scheme:dark){:root{--bg:#141A21;--card:#1C242D;--ink:#E7ECF1;--muted:#9AA7B5;--line:#2C3642;--navy:#24365E;--ok:#5CB880;--accent:#E08A3C;--accent-soft:#3A2A18;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;font-size:15px}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--navy);color:#fff;padding:max(22px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left))}
.top .s{font-size:13px;opacity:.8}
.top h1{margin:6px 0 2px;font-size:27px;line-height:1.3}
.top .sub{font-size:14px;opacity:.9}
.body{padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.ready{background:var(--ok);color:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.ready b{font-size:18px}
.track{display:flex;justify-content:space-between;position:relative;margin:4px 2px 0}
.track::before{content:"";position:absolute;left:12px;right:12px;top:11px;height:3px;background:var(--line)}
.track .fill{position:absolute;left:12px;top:11px;height:3px;background:var(--ok)}
.tk{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:56px;font-size:12px;text-align:center;color:var(--muted);line-height:1.3}
.tk .c{width:24px;height:24px;border-radius:50%;background:var(--card);border:3px solid var(--line);z-index:1}
.tk.done .c{background:var(--ok);border-color:var(--ok)}
.tk.next .c{border-color:var(--accent);background:var(--accent-soft)}
.tk.done,.tk.next{color:var(--ink);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.label{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-bottom:10px}
.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:16px;position:relative}
.fi::before{content:"";position:absolute;left:6px;top:16px;bottom:0;width:2px;background:var(--line)}
.fi:last-child::before{display:none}
.fi .b{width:14px;height:14px;border-radius:50%;background:var(--ok);margin-top:5px}
.fi .h{font-weight:700}.fi .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:104px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:zoom-in}
.note{font-size:12px;color:var(--muted);text-align:center}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;z-index:9;padding:12px}
.lb img{max-width:100%;max-height:90vh;border-radius:6px}
.msg{padding:60px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">讀取中…</div></div>
<div class="lb" id="lb" hidden><img id="lbimg" alt="整備照片"></div>
<script>
// 防呆：這個檔案只能放在 GitHub 的 yongjun-sales，放錯（例如打卡系統 yongjun-punch）會直接顯示警告
if (location.hostname.endsWith('github.io') && !location.pathname.startsWith('/yongjun-sales/')) {
  document.addEventListener('DOMContentLoaded', () => { document.body.innerHTML = '<div style="padding:40px 20px;font:16px/1.7 sans-serif;text-align:center;color:#B3261E"><b style="font-size:20px">⚠️ 檔案放錯地方了</b><br>這是「永駿客戶專屬頁」的檔案，應該上傳到 GitHub 的 <b>yongjun-sales</b>。<br>請到這個資料夾的 History 把剛才的上傳還原。</div>'; });
  throw new Error('wrong repo');
}
</script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzsewthHYW4Dpz-D-pr4xrmqwK5wKo22B1lEUzReJsa9mzLlutbI5k4sYspnoygb6OIxg/exec';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => s ? `${+s.slice(5, 7)}/${+s.slice(8, 10)}` : '';
const today = () => { const d = new Date(Date.now() + 8 * 3600e3); return d.toISOString().slice(0, 10).replace(/-/g, '/'); };
function render(d) {
  const last = d.stages.length - 1, ready = d.stage >= last, done = d.status === '已交車';
  const pct = d.stage / last * 100;
  const head = done ? '已完成交車' : ready ? '車輛整備完成' : `${d.stages[d.stage]}完成`;
  const sub = done ? `交車日 ${d.delivered}・感謝您選擇永駿車業` : ready ? '可以進行交車了，業務會盡快與您約定時間' : (d.eta ? `預計 ${md(d.eta)} 可交車・下一步：${d.stages[d.stage + 1]}` : `下一步：${d.stages[d.stage + 1]}`);
  const ups = [...d.updates].sort((a, b) => b.time.localeCompare(a.time));
  document.getElementById('app').innerHTML = `
  <header class="top"><div class="s">永駿車業・${esc(d.customer)}的愛車整備進度</div><h1>${head}</h1><div class="sub">${sub}</div></header>
  <main class="body">
    ${ready && !done ? `<div class="ready"><b>✓ 車輛整備完成，可以進行交車</b><span>您的 ${esc(d.car)} 已全部整備完畢，業務 ${esc(d.seller)} 會盡快與您聯絡交車時間。</span></div>` : ''}
    ${d.warrantyEnd ? `<div class="card"><dl class="kv"><dt>交車日</dt><dd><b>${esc(d.delivered)}</b></dd>
      <dt>保固</dt><dd>${d.warrantyEnd >= today() ? `<b style="color:var(--ok)">保固中</b>，至 ${esc(d.warrantyEnd)}` : `已於 ${esc(d.warrantyEnd)} 到期`}</dd>
      ${d.insurance ? `<dt>車險</dt><dd>${esc(d.insurance.company)} ${esc(d.insurance.type)}・${esc(d.insurance.expire)} 到期</dd>` : ''}</dl></div>
      ${d.coupons && d.coupons.length ? `<div class="card"><div class="label">我的優惠券</div>${d.coupons.map(c => `<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1.5px dashed var(--accent);border-radius:10px;background:var(--accent-soft);margin-bottom:8px"><b>${esc(c.text)}</b><span style="font-size:13px;white-space:nowrap">${md(c.expire)} 前</span></div>`).join('')}<div class="note">使用前請先透過 LINE 與業務預約</div></div>` : ''}` : ''}
    ${d.updates.length ? `<div class="card"><div class="track"><span class="fill" style="width:calc(${pct}% - ${pct / 100 * 24}px)"></span>
      ${d.stages.map((s, i) => `<div class="tk ${i <= d.stage ? 'done' : i === d.stage + 1 ? 'next' : ''}"><span class="c"></span>${esc(s).replace('／', '<br>')}</div>`).join('')}</div></div>` : ''}
    <div class="card"><dl class="kv"><dt>車輛</dt><dd>${esc(d.brand)} ${esc(d.model)} ${esc(String(d.year).slice(0, 4))}</dd>${d.color ? `<dt>顏色</dt><dd>${esc(d.color)}</dd>` : ''}
      <dt>車牌</dt><dd>${esc(d.plate)}</dd><dt>負責業務</dt><dd>${esc(d.seller)}</dd></dl></div>
    ${d.updates.length ? `<div class="card"><div class="label">整備紀錄</div><div class="feed">${ups.map(u => `<div class="fi"><span class="b"></span><div>
      <div class="h">${esc(d.stages[u.stage])}</div><div class="tm">${esc(u.time.slice(0, 16))}</div>
      ${u.note ? `<div style="margin-top:4px">${esc(u.note)}</div>` : ''}
      ${u.photos.length ? `<div class="thumbs">${u.photos.map(p => `<img src="${p}" alt="${esc(d.stages[u.stage])}照片" loading="lazy">`).join('')}</div>` : ''}</div></div>`).join('')}</div></div>` : ''}
    <div class="note">此頁面僅供查看・如有問題請直接在 LINE 聯絡您的業務</div>
  </main>`;
}
document.addEventListener('click', e => {
  if (e.target.closest('#lb')) { document.getElementById('lb').hidden = true; return; }
  if (e.target.matches('.thumbs img')) { document.getElementById('lbimg').src = e.target.src; document.getElementById('lb').hidden = false; }
});
(async () => {
  const t = new URLSearchParams(location.search).get('t') || '';
  try {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'customer', t }) });
    const d = await res.json();
    if (!d.ok) throw new Error(d.message);
    render(d);
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="msg">${esc(e.message || '讀取失敗，請稍後再試')}</div>`;
  }
})();
</script>
</body>
</html>
